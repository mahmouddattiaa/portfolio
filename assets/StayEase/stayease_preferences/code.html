<div class="mt-4 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</button>

</div>
<div class="mt-8">

</div>
</button>
<!-- Seaside - Horizontal -->

</button>

<div class="w-14 h-14 rounded-full bg-white flex items-center justify-center shadow-sm">

<div>

</div>
</div>

<a class="flex flex-col items-center justify-center text-[#56423d] dark:text-[#dcc1ba] px-5 py-2 group hover:text-[#994127] dark:hover:text-[#ffdbd1] transition-colors active:scale-90 duration-300 ease-out" href="#">
