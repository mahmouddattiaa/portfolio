<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FitForge | Goal Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&amp;family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-container": "#0f6d00",
              "on-tertiary": "#003919",
              "on-primary-fixed-variant": "#872000",
              "surface-container-low": "#1c1b1b",
              "surface-variant": "#353534",
              "on-surface-variant": "#e7bdb2",
              "on-primary": "#601400",
              "surface": "#131313",
              "on-tertiary-container": "#003115",
              "on-surface": "#e5e2e1",
              "surface-container-highest": "#353534",
              "on-primary-container": "#541100",
              "surface-container-high": "#2a2a2a",
              "on-secondary": "#053900",
              "surface-bright": "#393939",
              "secondary": "#d7ffc5",
              "inverse-surface": "#e5e2e1",
              "tertiary-container": "#00a657",
              "surface-dim": "#131313",
              "primary-fixed": "#ffdbd1",
              "surface-container": "#201f1f",
              "tertiary-fixed": "#6bfe9c",
              "on-secondary-fixed": "#022100",
              "surface-tint": "#ffb5a0",
              "tertiary-fixed-dim": "#4ae183",
              "surface-container-lowest": "#0e0e0e",
              "primary": "#ffb5a0",
              "on-tertiary-fixed": "#00210c",
              "tertiary": "#4ae183",
              "inverse-primary": "#b12d00",
              "primary-fixed-dim": "#ffb5a0",
              "outline-variant": "#5d4038",
              "outline": "#ad887e",
              "background": "#131313",
              "on-error": "#690005",
              "inverse-on-surface": "#313030",
              "error-container": "#93000a",
              "secondary-container": "#2ff801",
              "on-background": "#e5e2e1",
              "on-primary-fixed": "#3b0900",
              "on-secondary-fixed-variant": "#095300",
              "primary-container": "#ff5625",
              "on-error-container": "#ffdad6",
              "secondary-fixed": "#79ff5b",
              "secondary-fixed-dim": "#2ae500",
              "error": "#ffb4ab",
              "on-tertiary-fixed-variant": "#005228"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-gradient {
            background: linear-gradient(45deg, #ff5625, #872000);
        }
        .glass-card {
            background: rgba(53, 53, 52, 0.6);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body selection:bg-primary-container selection:text-white">
<!-- Brand Header -->
<header class="flex justify-between items-center w-full px-6 py-4 sticky top-0 z-50 bg-[#131313]">
<h1 class="text-2xl font-black italic tracking-tighter text-[#ff5625] font-headline uppercase">FITFORGE</h1>
<div class="h-10 w-10 rounded-full bg-surface-container-highest border border-outline-variant/15 flex items-center justify-center overflow-hidden">
<img alt="Profile" class="w-full h-full object-cover" data-alt="close-up of a determined young athlete with sweat on their brow in a moody high-contrast gym setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_Fhr0a6r7vP1jufadlAZL7tlc39JkBgZ_u_uTVHYr5ZCMD3dpRAgG1Nmi6dYKE5_M7segZYwjyxICn0BKKPNVeYTjNyzBLE_VetrXvsUsIEpIQ2cjetE0o2P-HYsDYhVG3TmEGgKE0VlAqM_pdRc9qaiWU5FEHOBYGvVuUsIGRIUqPiB5GGflKWWyAFwkqjJxVNHV_sy6hHeeK1hFW548ki2L69FHswnrrsYY4RSVhmjzCP1VVFu4N-hm_dtzRIAXsaaNL0O-7FkU"/>
</div>
</header>
<main class="min-h-[calc(100vh-160px)] px-6 pt-8 pb-32 max-w-2xl mx-auto flex flex-col">
<!-- Progress Bar -->
<div class="w-full h-1.5 bg-surface-container-highest mb-12 flex">
<div class="h-full kinetic-gradient w-1/3 shadow-[0_0_15px_rgba(255,86,37,0.5)]"></div>
<div class="h-full w-2/3"></div>
</div>
<!-- Headline Section -->
<div class="mb-12">
<span class="font-headline text-primary-container font-bold tracking-widest uppercase text-xs mb-2 block">Step 01 / 03</span>
<h2 class="font-headline text-4xl md:text-5xl font-extrabold tracking-tighter uppercase leading-[0.9] text-on-background">
                What is your <br/> <span class="text-primary-container italic">fitness goal?</span>
</h2>
</div>
<!-- Options Grid -->
<div class="space-y-4">
<!-- Muscle Gain (Active State) -->
<button class="w-full text-left group transition-all duration-200 active:scale-[0.98]">
<div class="relative p-6 rounded-xl overflow-hidden border-2 border-primary-container bg-surface-container-high shadow-[0px_20px_40px_rgba(0,0,0,0.4)]">
<div class="flex items-center justify-between relative z-10">
<div class="flex items-center gap-5">
<div class="w-14 h-14 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<div>
<h3 class="font-headline text-xl font-bold uppercase tracking-tight text-on-surface">Muscle Gain</h3>
<p class="text-sm text-on-surface-variant/80 font-medium">Hypertrophy and strength training</p>
</div>
</div>
<span class="material-symbols-outlined text-primary-container">check_circle</span>
</div>
<!-- Subtle decorative background text for Brutalist feel -->
<span class="absolute -bottom-4 -right-2 text-6xl font-black text-white/5 font-headline pointer-events-none uppercase">POWER</span>
</div>
</button>
<!-- Fat Loss -->
<button class="w-full text-left group transition-all duration-200 hover:bg-surface-container-highest/50 rounded-xl active:scale-[0.98]">
<div class="p-6 rounded-xl bg-surface-container-low border border-outline-variant/10 flex items-center justify-between">
<div class="flex items-center gap-5">
<div class="w-14 h-14 rounded-lg bg-surface-container-highest flex items-center justify-center text-on-surface-variant group-hover:text-primary">
<span class="material-symbols-outlined text-3xl">local_fire_department</span>
</div>
<div>
<h3 class="font-headline text-xl font-bold uppercase tracking-tight text-on-surface">Fat Loss</h3>
<p class="text-sm text-on-surface-variant/60 font-medium">Burn calories and increase metabolism</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant/20 group-hover:text-primary/40">radio_button_unchecked</span>
</div>
</button>
<!-- Maintenance -->
<button class="w-full text-left group transition-all duration-200 hover:bg-surface-container-highest/50 rounded-xl active:scale-[0.98]">
<div class="p-6 rounded-xl bg-surface-container-low border border-outline-variant/10 flex items-center justify-between">
<div class="flex items-center gap-5">
<div class="w-14 h-14 rounded-lg bg-surface-container-highest flex items-center justify-center text-on-surface-variant group-hover:text-primary">
<span class="material-symbols-outlined text-3xl">balance</span>
</div>
<div>
<h3 class="font-headline text-xl font-bold uppercase tracking-tight text-on-surface">Maintenance</h3>
<p class="text-sm text-on-surface-variant/60 font-medium">Stay fit and improve overall health</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant/20 group-hover:text-primary/40">radio_button_unchecked</span>
</div>
</button>
</div>
<!-- Descriptive Quote / Microcopy -->
<div class="mt-10 p-4 border-l-2 border-secondary-container bg-secondary-container/5 rounded-r-lg">
<p class="text-xs font-medium text-secondary italic leading-relaxed">
                "Intensity is not a switch, it's a lifestyle. Choose your path and we'll forge the results together."
            </p>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-6 glass-card z-50">
<div class="max-w-2xl mx-auto flex gap-4">
<button class="flex-1 kinetic-gradient h-16 rounded-lg shadow-[0px_10px_30px_rgba(255,86,37,0.3)] flex items-center justify-center gap-3 active:scale-95 transition-transform">
<span class="font-headline text-lg font-black uppercase tracking-tighter text-white">Next Step</span>
<span class="material-symbols-outlined text-white">arrow_forward</span>
</button>
</div>
<!-- Safety padding for mobile notches -->
<div class="h-4"></div>
</div>
<!-- Background Decorative Element -->
<div class="fixed top-0 right-0 -z-10 w-full h-full overflow-hidden pointer-events-none opacity-20">
<div class="absolute -top-24 -right-24 w-[600px] h-[600px] bg-primary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute top-1/2 -left-24 w-[400px] h-[400px] bg-secondary-container/10 rounded-full blur-[100px]"></div>
</div>
</body></html>
