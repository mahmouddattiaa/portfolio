<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FitForge | Goal Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&amp;family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-container": "#0f6d00",
                        "on-tertiary": "#003919",
                        "on-primary-fixed-variant": "#872000",
                        "surface-container-low": "#1c1b1b",
                        "surface-variant": "#353534",
                        "on-surface-variant": "#e7bdb2",
                        "on-primary": "#601400",
                        "surface": "#131313",
                        "on-tertiary-container": "#003115",
                        "on-surface": "#e5e2e1",
                        "surface-container-highest": "#353534",
                        "on-primary-container": "#541100",
                        "surface-container-high": "#2a2a2a",
                        "on-secondary": "#053900",
                        "surface-bright": "#393939",
                        "secondary": "#d7ffc5",
                        "inverse-surface": "#e5e2e1",
                        "tertiary-container": "#00a657",
                        "surface-dim": "#131313",
                        "primary-fixed": "#ffdbd1",
                        "surface-container": "#201f1f",
                        "tertiary-fixed": "#6bfe9c",
                        "on-secondary-fixed": "#022100",
                        "surface-tint": "#ffb5a0",
                        "tertiary-fixed-dim": "#4ae183",
                        "surface-container-lowest": "#0e0e0e",
                        "primary": "#ffb5a0",
                        "on-tertiary-fixed": "#00210c",
                        "tertiary": "#4ae183",
                        "inverse-primary": "#b12d00",
                        "primary-fixed-dim": "#ffb5a0",
                        "outline-variant": "#5d4038",
                        "outline": "#ad887e",
                        "background": "#131313",
                        "on-error": "#690005",
                        "inverse-on-surface": "#313030",
                        "error-container": "#93000a",
                        "secondary-container": "#2ff801",
                        "on-background": "#e5e2e1",
                        "on-primary-fixed": "#3b0900",
                        "on-secondary-fixed-variant": "#095300",
                        "primary-container": "#ff5625",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed": "#79ff5b",
                        "secondary-fixed-dim": "#2ae500",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#005228"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 700, 'GRAD' 0, 'opsz' 24;
        }
        .brutal-shadow {
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.4);
        }
        .kinetic-gradient {
            background: linear-gradient(45deg, #ff5625, #872000);
        }
        .glass-card {
            background: rgba(19, 19, 19, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-white min-h-screen">
<!-- Brand Header -->
<header class="flex justify-between items-center w-full px-6 py-4 sticky top-0 z-50 bg-[#131313]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden border-2 border-primary/20">
<img alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqNX0tXrXdCX0PJqJFzpyQEFaRWF4gXyUfZbFLImv4q7Fh4GGmSfusTVUZ_ldzTEerxpvHsnk_aqj7qrlHSs0MegteHNHxoKiAZM5AqZxJlkveX-5cPFzDLMvCo6qlzpUy-qiVpLq0-Qr1HuBArthkJkAZ5vBiAsuvVrpWhTjDBBYJ8ZdGHqhH4sXRyAf6HdX3JXWplQU6aelSK_t9ayY7viEL3TKzfoHTO458hz1EyozejUco4Q4w61KO5Ff7dAh4i7iaR9cjqCNz"/>
</div>
</div>
<div class="font-['Space_Grotesk'] font-black italic tracking-tighter text-[#ff5625] text-2xl uppercase">FITFORGE</div>
<button class="material-symbols-outlined text-[#e5e2e1] hover:opacity-80 transition-opacity active:scale-95 duration-200">
        notifications
    </button>
</header>
<main class="px-6 pt-4 pb-32 max-w-2xl mx-auto flex flex-col space-y-10">
<!-- Progress & Header -->
<div class="space-y-6">
<div class="flex justify-between items-end">
<div class="space-y-1">
<span class="font-label text-primary-container font-bold tracking-[0.2em] uppercase text-xs">Step 01 / 03</span>
<h1 class="font-headline text-5xl md:text-6xl font-black tracking-tighter uppercase leading-[0.85] text-on-surface">
                    What is your <br/> <span class="text-primary-container italic">fitness goal?</span>
</h1>
</div>
<div class="hidden md:block w-32 h-1 bg-surface-container-highest relative">
<div class="absolute inset-y-0 left-0 w-1/3 bg-primary-container shadow-[0_0_10px_#ff5625]"></div>
</div>
</div>
</div>
<!-- Options Grid -->
<div class="space-y-4">
<!-- Muscle Gain (Active State) -->
<button class="w-full text-left group transition-all duration-200 active:scale-[0.98]">
<div class="relative p-6 rounded-xl overflow-hidden border-2 border-primary-container bg-surface-container-high brutal-shadow">
<div class="flex items-center justify-between relative z-10">
<div class="flex items-center gap-5">
<div class="w-14 h-14 rounded-md bg-primary-container flex items-center justify-center text-on-surface shadow-[0_0_20px_rgba(255,86,37,0.4)]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<div>
<h3 class="font-headline text-2xl font-black uppercase tracking-tighter text-on-surface leading-none">Muscle Gain</h3>
<p class="text-xs text-on-surface-variant/80 font-bold uppercase tracking-widest mt-1">Power &amp; Hypertrophy</p>
</div>
</div>
<span class="material-symbols-outlined text-primary-container text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Brutalist background decoration -->
<span class="absolute -bottom-6 -right-4 text-8xl font-black text-white/[0.03] font-headline pointer-events-none uppercase italic">FORGE</span>
</div>
</button>
<!-- Fat Loss -->
<button class="w-full text-left group transition-all duration-200 hover:bg-surface-container-highest/50 active:scale-[0.98]">
<div class="p-6 rounded-xl bg-surface-container-low border border-outline-variant/10 flex items-center justify-between transition-colors group-hover:border-primary-container/30">
<div class="flex items-center gap-5">
<div class="w-14 h-14 rounded-md bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:text-primary-container transition-colors">
<span class="material-symbols-outlined text-3xl">local_fire_department</span>
</div>
<div>
<h3 class="font-headline text-2xl font-black uppercase tracking-tighter text-on-surface/60 group-hover:text-on-surface leading-none transition-colors">Fat Loss</h3>
<p class="text-xs text-on-surface-variant/40 font-bold uppercase tracking-widest mt-1">Incinerate Calories</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant/20 group-hover:text-primary-container/40">radio_button_unchecked</span>
</div>
</button>
<!-- Maintenance -->
<button class="w-full text-left group transition-all duration-200 hover:bg-surface-container-highest/50 active:scale-[0.98]">
<div class="p-6 rounded-xl bg-surface-container-low border border-outline-variant/10 flex items-center justify-between transition-colors group-hover:border-primary-container/30">
<div class="flex items-center gap-5">
<div class="w-14 h-14 rounded-md bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:text-primary-container transition-colors">
<span class="material-symbols-outlined text-3xl">balance</span>
</div>
<div>
<h3 class="font-headline text-2xl font-black uppercase tracking-tighter text-on-surface/60 group-hover:text-on-surface leading-none transition-colors">Maintenance</h3>
<p class="text-xs text-on-surface-variant/40 font-bold uppercase tracking-widest mt-1">Peak Performance</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant/20 group-hover:text-primary-container/40">radio_button_unchecked</span>
</div>
</button>
</div>
<!-- Descriptive Quote -->
<div class="p-6 border-l-4 border-secondary bg-surface-container-low/50 rounded-r-xl">
<p class="text-sm font-bold text-secondary uppercase tracking-widest italic leading-relaxed">
            "Intensity is not a switch, it's a lifestyle. Choose your path and we'll forge the results together."
        </p>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-6 glass-card z-50 border-t border-white/5">
<div class="max-w-2xl mx-auto">
<button class="w-full bg-primary-container h-16 rounded-md brutal-shadow flex items-center justify-center gap-3 active:scale-95 transition-all group">
<span class="font-headline text-2xl font-black uppercase tracking-tighter text-on-surface">Next Step</span>
<span class="material-symbols-outlined text-on-surface group-hover:translate-x-1 transition-transform" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
<!-- Navigation (Mini) -->
<nav class="max-w-2xl mx-auto flex justify-around items-center pt-6 opacity-40 grayscale pointer-events-none">
<div class="flex flex-col items-center"><span class="material-symbols-outlined text-sm">home_max</span></div>
<div class="flex flex-col items-center"><span class="material-symbols-outlined text-sm">fitness_center</span></div>
<div class="flex flex-col items-center"><span class="material-symbols-outlined text-sm">monitoring</span></div>
</nav>
<div class="h-2"></div>
</div>
<!-- Background Elements -->
<div class="fixed top-0 right-0 -z-10 w-full h-full overflow-hidden pointer-events-none">
<div class="absolute top-1/4 -right-20 w-[500px] h-[500px] bg-primary-container/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-20 -left-20 w-[400px] h-[400px] bg-secondary/5 rounded-full blur-[100px]"></div>
</div>
</body></html>
