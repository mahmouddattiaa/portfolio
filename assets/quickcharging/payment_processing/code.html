<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed": "#00343d",
              "tertiary-dim": "#00cdec",
              "outline": "#70767f",
              "on-primary-fixed-variant": "#006832",
              "inverse-primary": "#006e35",
              "error": "#ff716c",
              "on-surface-variant": "#a5abb5",
              "on-surface": "#ebf1fb",
              "on-primary": "#005d2c",
              "on-secondary-fixed-variant": "#005964",
              "error-container": "#9f0519",
              "surface-tint": "#3fff8b",
              "primary": "#3fff8b",
              "primary-container": "#13ea79",
              "tertiary-container": "#00dcfd",
              "surface-container-high": "#18202a",
              "secondary-fixed-dim": "#00d7f0",
              "on-error": "#490006",
              "tertiary": "#7ae6ff",
              "secondary-container": "#006875",
              "on-background": "#ebf1fb",
              "error-dim": "#d7383b",
              "surface-container-lowest": "#000000",
              "on-tertiary-container": "#004955",
              "inverse-surface": "#f8f9ff",
              "surface-variant": "#1e2731",
              "surface-bright": "#232d38",
              "on-primary-container": "#004f24",
              "on-secondary-container": "#e8fbff",
              "on-tertiary": "#005360",
              "on-primary-fixed": "#004820",
              "primary-fixed": "#3fff8b",
              "secondary": "#00e3fd",
              "surface-dim": "#080f16",
              "on-tertiary-fixed-variant": "#005361",
              "surface-container": "#131a23",
              "secondary-dim": "#00d4ec",
              "tertiary-fixed-dim": "#00cdec",
              "surface-container-low": "#0d141c",
              "secondary-fixed": "#26e6ff",
              "primary-dim": "#24f07e",
              "primary-fixed-dim": "#24f07e",
              "surface-container-highest": "#1e2731",
              "on-error-container": "#ffa8a3",
              "surface": "#080f16",
              "on-secondary": "#004d57",
              "tertiary-fixed": "#00dcfd",
              "background": "#080f16",
              "on-secondary-fixed": "#003a42",
              "outline-variant": "#424851",
              "inverse-on-surface": "#4f565e"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-glow {
            box-shadow: 0 0 40px -10px rgba(63, 255, 139, 0.3);
        }
        .milled-effect {
            background: linear-gradient(135deg, #0d141c 0%, #000000 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-[#080f16] flex items-center justify-between px-6 h-16 w-full fixed top-0 z-50">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#3fff8b]" data-icon="menu">menu</span>
<h1 class="font-['Inter'] font-extrabold uppercase tracking-wider text-sm text-[#ebf1fb]">Station 03 — Terminal 12345678</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#3fff8b]" data-icon="bolt" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-['Inter'] font-extrabold text-[#3fff8b] text-sm uppercase">CCS Active</span>
</div>
</header>
<!-- Main Processing Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-6 relative">
<!-- Background HUD Decoration -->
<div class="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none">
<div class="w-[800px] h-[800px] border-[1px] border-primary rounded-full"></div>
<div class="absolute w-[600px] h-[600px] border-[1px] border-secondary rounded-full"></div>
</div>
<!-- Central Action Area -->
<div class="relative z-10 flex flex-col items-center max-w-md w-full">
<!-- Animated Visual Anchor -->
<div class="relative mb-12 flex items-center justify-center">
<!-- Outer Spinning Ring -->
<div class="w-48 h-48 rounded-full border-4 border-surface-container-highest border-t-primary animate-[spin_2s_linear_infinite] kinetic-glow"></div>
<!-- Inner Bolt Icon (Glassmorphism Core) -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-32 h-32 bg-surface-container-high/60 backdrop-blur-xl rounded-full flex items-center justify-center border border-outline-variant/20">
<span class="material-symbols-outlined text-primary text-6xl drop-shadow-[0_0_15px_rgba(63,255,139,0.8)]" data-icon="bolt" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
</div>
</div>
<!-- Status Messaging -->
<div class="text-center space-y-4">
<h2 class="text-4xl font-black uppercase tracking-tight text-on-surface">
                    Processing Payment…
                </h2>
<div class="flex flex-col items-center gap-2">
<p class="text-secondary font-bold uppercase text-xs tracking-[0.2em] opacity-80">
                        Awaiting Authorization
                    </p>
<div class="h-1 w-24 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-primary to-secondary w-2/3 animate-[pulse_1.5s_infinite]"></div>
</div>
</div>
</div>
<!-- Instructional Overlay Card -->
<div class="mt-16 w-full p-8 milled-effect rounded-lg border border-outline-variant/10 text-center">
<span class="material-symbols-outlined text-secondary-dim mb-4 block" data-icon="contactless">contactless</span>
<p class="text-on-surface-variant font-bold text-sm leading-relaxed uppercase tracking-wide">
                    Please follow instructions on the POS terminal.
                </p>
</div>
</div>
<!-- Footer Reference Section (Pinned to bottom above Nav) -->
<div class="absolute bottom-20 left-0 w-full px-6 flex justify-between items-end">
<div class="flex flex-col">
<span class="text-[10px] font-black uppercase tracking-widest text-outline">Terminal ID</span>
<span class="text-xs font-mono text-on-surface-variant">HW-772-BETA</span>
</div>
<div class="flex flex-col items-end">
<span class="text-[10px] font-black uppercase tracking-widest text-outline">Transaction Reference</span>
<span class="text-xs font-mono text-primary-container bg-surface-container-lowest px-2 py-1">Ref: TXN-A3F92B1C</span>
</div>
</div>
</main>
<!-- BottomNavBar (Status Only) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-[#000000] px-4 h-12 border-t border-[#424851]/20">
<div class="text-[#3fff8b] flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-lg" data-icon="check_circle">check_circle</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-widest">Terminal Ready</span>
</div>
<div class="text-[#00e3fd] flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-lg" data-icon="lan">lan</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-widest">Network Online</span>
</div>
<div class="text-[#00e3fd] flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-lg" data-icon="bolt">bolt</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-widest">CCS Active</span>
</div>
</nav>
</body></html>
