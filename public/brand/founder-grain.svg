<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="founder-grain-title founder-grain-desc">
  <title id="founder-grain-title">Founder photography — copper grain overlay</title>
  <desc id="founder-grain-desc">Tileable copper-tinted film-grain overlay. Designed to sit above any of the three founder photography placeholders at low opacity, simulating gentle analog grain without overpowering the underlying composition.</desc>

  <defs>
    <filter id="grain-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.659
                             0 0 0 0 0.435
                             0 0 0 0 0.282
                             0 0 0 0.55 0"/>
    </filter>
  </defs>

  <rect width="400" height="400" filter="url(#grain-noise)" opacity="0.08"/>
</svg>
