<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-labelledby="founder-placeholder-title founder-placeholder-desc">
  <title id="founder-placeholder-title">Founder portrait placeholder</title>
  <desc id="founder-placeholder-desc">A subtle, honest placeholder for the founder portrait on the studio page, indicating that a photograph is pending approval.</desc>

  <rect width="600" height="750" fill="#EEE9E0"/>

  <rect x="24" y="24" width="552" height="702" fill="none" stroke="#07120F" stroke-width="1.5" stroke-opacity="0.32"/>

  <g fill="none" stroke="#A86F48" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6">
    <circle cx="240" cy="248" r="54"/>
    <line x1="240" y1="302" x2="240" y2="556"/>
    <line x1="172" y1="416" x2="308" y2="416"/>
  </g>

  <circle cx="48" cy="48" r="3" fill="#A86F48"/>
  <circle cx="552" cy="48" r="3" fill="#A86F48"/>

  <g font-family="sans-serif" fill="#202826">
    <text x="48" y="60" font-size="11" font-weight="500" letter-spacing="2.4" fill-opacity="0.7">KEPLER DEV</text>
